<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/Fu3rte/src/assets/sarff.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <title>Fu3rte</title>
</head>

<body>
  <div id="root"></div>
  <script>
    // Restore the real route after the 404.html redirect (see public/404.html).
    // Converts ?p=/route&q=query back into a clean pathname before React mounts.
    (function () {
      var search = window.location.search;
      if (!search) return;
      var params = {};
      search.slice(1).split('&').forEach(function (pair) {
        var parts = pair.split('=');
        params[parts[0]] = decodeURIComponent(parts.slice(1).join('=').replace(/~and~/g, '&'));
      });
      if (params.p !== undefined) {
        var restored =
          window.location.pathname.slice(0, -1) + params.p +
          (params.q ? '?' + params.q : '') +
          window.location.hash;
        window.history.replaceState(null, null, restored);
      }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
