<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // This script converts the current URL's path + query into a query string,
    // then redirects to the app root so react-router can handle the route.
    // pathSegmentsToKeep = 0 because the app lives at /<route>.
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>

<body>
  If you are not redirected automatically, <a href="/">click here</a>.
</body>

</html>
